# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: stdio
  configSchema:
    type: object
    required: [voyagierToken]
    properties:
      voyagierToken:
        type: string
        description: Voyagier personal access token (request access at https://www.voyagier.com/agents)
      mcpUrl:
        type: string
        description: "Optional hosted MCP endpoint override (defaults to https://mcp.voyagier.com/api/mcp)"
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@voyagier/cli', 'mcp'],
      env: {
        VOYAGIER_TOKEN: config.voyagierToken,
        ...(config.mcpUrl ? { VOYAGIER_MCP_URL: config.mcpUrl } : {})
      }
    })
  exampleConfig:
    voyagierToken: voy_pat_example123
