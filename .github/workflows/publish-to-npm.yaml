name: Publish to NPM

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Workflow Branch
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::${{ github.ref_name }} is not an allowed branch for Publish to NPM"
            exit 1
          fi

      - name: Checkout the Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Determine Publish Mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest tag across ALL refs (fetch-depth 0 fetches every tag) — a pending
          # release tag lives on an unmerged release/* branch, which `git describe`
          # from main would never see.
          LATEST_TAG=$(git tag --sort=-version:refname | head -n1)
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "$PKG_VERSION" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # main is behind the newest tag: either a pending release PR (finalization
          # complete — block until merged) or a partially-failed previous run (finish it).
          RELEASE_EXISTS=no; PR_EXISTS=no
          gh release view "$LATEST_TAG" >/dev/null 2>&1 && RELEASE_EXISTS=yes
          [ -n "$(gh pr list --head "release/$LATEST_TAG" --state open --json number --jq '.[].number')" ] && PR_EXISTS=yes
          if [ "$RELEASE_EXISTS" = "yes" ] && [ "$PR_EXISTS" = "yes" ]; then
            echo "::error::package.json ($PKG_VERSION) does not match latest tag ($LATEST_TAG) — merge the pending release PR before publishing again"
            exit 1
          fi
          echo "Incomplete release $LATEST_TAG detected (release: $RELEASE_EXISTS, PR: $PR_EXISTS) — entering recovery"
          echo "mode=recover" >> "$GITHUB_OUTPUT"
          echo "recover_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Determine Version Bump
        if: steps.mode.outputs.mode == 'publish'
        id: determine-bump
        run: |
          # All-refs newest tag, not `git describe`: a squash-merged release PR leaves
          # the tag's commit outside main's history, so describe would pick an older tag.
          LATEST_TAG=$(git tag --sort=-version:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tags found, defaulting to minor bump"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMIT_COUNT=$(git rev-list "$LATEST_TAG"..HEAD --count)
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "::error::No new commits since $LATEST_TAG, nothing to publish"
            exit 1
          fi

          COMMITS=$(git log "$LATEST_TAG"..HEAD --format="%s")

          BUMP=""

          # Conventional Commits: BREAKING CHANGE appears in the body/footer, not the subject
          if git log "$LATEST_TAG"..HEAD --format="%B" | grep -qE '^BREAKING[ -]CHANGE:'; then
            BUMP="major"
          fi

          while IFS= read -r subject; do
            if [ -z "$subject" ]; then continue; fi

            if echo "$subject" | grep -qE '^[a-z]+(\(.+\))?!:'; then
              BUMP="major"
              break
            fi

            if echo "$subject" | grep -qE '^feat(\(.+\))?:'; then
              if [ "$BUMP" != "major" ]; then
                BUMP="minor"
              fi
            fi

            if echo "$subject" | grep -qE '^fix(\(.+\))?:'; then
              if [ -z "$BUMP" ]; then
                BUMP="patch"
              fi
            fi
          done <<< "$COMMITS"

          # No feat/fix/breaking changes since last tag -> patch.
          # (e.g., ci:/chore:/docs: and other conventional-commit types that don't imply a feature/fix.)
          # Previous default of minor burned version slots on housekeeping releases
          # (2.9.x->2.10.0, 2.13.x->2.14.0).
          if [ -z "$BUMP" ]; then
            BUMP="patch"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Version bump: $BUMP"

      - name: Configure Git Identity
        run: |
          git config --global user.email "apis@voyagier.com"
          git config --global user.name "Voyagier Bot"

      - name: Resolve Version
        id: bump-version
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "recover" ]; then
            # Finalize from the already-tagged release commit
            NEW_VERSION="${{ steps.mode.outputs.recover_tag }}"
            git checkout -q "$NEW_VERSION"
          else
            NEW_VERSION=$(npm --no-git-tag-version version ${{ steps.determine-bump.outputs.bump }})
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $NEW_VERSION"

      - name: Build
        run: npm run build

      - name: Publish to NPM
        run: |
          VERSION="${{ steps.bump-version.outputs.new_version }}"
          if npm view "@voyagier/cli@${VERSION#v}" version >/dev/null 2>&1; then
            echo "${VERSION#v} already on npm — skipping publish (re-run recovery)"
          else
            npm publish --access public --provenance
          fi

      # main is protected by the "Protect main (PRs only)" ruleset (no bypass actors),
      # so the version-bump commit lands via a release PR instead of a direct push.
      # The tag and GitHub release point at the release-branch commit, which becomes
      # part of main's history when the PR merges.
      # Finalization steps are idempotent so a re-run after a partial failure
      # (e.g. npm publish succeeded but a later step died) walks through completed
      # steps as no-ops and finishes the missing ones.
      - name: Commit, Tag, and Push Release Branch Atomically
        run: |
          VERSION_TAG="${{ steps.bump-version.outputs.new_version }}"
          BRANCH="release/$VERSION_TAG"
          if git ls-remote --tags --exit-code origin "refs/tags/$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already on remote"
            if ! git ls-remote --heads --exit-code origin "$BRANCH" >/dev/null 2>&1; then
              echo "Release branch $BRANCH missing — recreating from tag (re-run recovery)"
              git push origin "$(git rev-parse "$VERSION_TAG^{commit}")":"refs/heads/$BRANCH"
            fi
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore: release $VERSION_TAG"
          git tag -a "$VERSION_TAG" -m "Release $VERSION_TAG"
          git push --atomic origin "$BRANCH" "$VERSION_TAG"

      - name: Create GitHub Release and Release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_TAG="${{ steps.bump-version.outputs.new_version }}"
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Release $VERSION_TAG already exists — skipping (re-run recovery)"
          else
            gh release create "$VERSION_TAG" --generate-notes --latest
          fi
          if [ -n "$(gh pr list --head "release/$VERSION_TAG" --state open --json number --jq '.[].number')" ]; then
            echo "Release PR for $VERSION_TAG already open — skipping (re-run recovery)"
            exit 0
          fi
          gh pr create \
            --head "release/$VERSION_TAG" \
            --title "chore: release $VERSION_TAG" \
            --body "Automated release PR: version bump for $VERSION_TAG, already published to npm with provenance. Merge to sync main with the released version — the next publish dispatch is blocked until this lands."
