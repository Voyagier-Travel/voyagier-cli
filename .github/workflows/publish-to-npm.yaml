name: Publish to NPM

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Workflow Branch
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::${{ github.ref_name }} is not an allowed branch for Publish to NPM"
            exit 1
          fi

      - name: Checkout the Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Verify No Pending Release PR
        run: |
          # Newest tag across ALL refs (fetch-depth 0 fetches every tag) — a pending
          # release tag lives on an unmerged release/* branch, which `git describe`
          # from main would never see.
          LATEST_TAG=$(git tag --sort=-version:refname | head -n1)
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "$PKG_VERSION" ]; then
            echo "::error::package.json ($PKG_VERSION) does not match latest tag ($LATEST_TAG) — merge the pending release PR before publishing again"
            exit 1
          fi

      - name: Determine Version Bump
        id: determine-bump
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tags found, defaulting to minor bump"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMIT_COUNT=$(git rev-list "$LATEST_TAG"..HEAD --count)
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "::error::No new commits since $LATEST_TAG, nothing to publish"
            exit 1
          fi

          COMMITS=$(git log "$LATEST_TAG"..HEAD --format="%s")

          BUMP=""

          # Conventional Commits: BREAKING CHANGE appears in the body/footer, not the subject
          if git log "$LATEST_TAG"..HEAD --format="%B" | grep -qE '^BREAKING[ -]CHANGE:'; then
            BUMP="major"
          fi

          while IFS= read -r subject; do
            if [ -z "$subject" ]; then continue; fi

            if echo "$subject" | grep -qE '^[a-z]+(\(.+\))?!:'; then
              BUMP="major"
              break
            fi

            if echo "$subject" | grep -qE '^feat(\(.+\))?:'; then
              if [ "$BUMP" != "major" ]; then
                BUMP="minor"
              fi
            fi

            if echo "$subject" | grep -qE '^fix(\(.+\))?:'; then
              if [ -z "$BUMP" ]; then
                BUMP="patch"
              fi
            fi
          done <<< "$COMMITS"

          if [ -z "$BUMP" ]; then
            BUMP="minor"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Version bump: $BUMP"

      - name: Configure Git Identity
        run: |
          git config --global user.email "apis@voyagier.com"
          git config --global user.name "Voyagier Bot"

      - name: Bump Version
        id: bump-version
        run: |
          NEW_VERSION=$(npm --no-git-tag-version version ${{ steps.determine-bump.outputs.bump }})
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Build
        run: npm run build

      - name: Publish to NPM
        run: npm publish --access public --provenance

      # main is protected by the "Protect main (PRs only)" ruleset (no bypass actors),
      # so the version-bump commit lands via a release PR instead of a direct push.
      # The tag and GitHub release point at the release-branch commit, which becomes
      # part of main's history when the PR merges.
      # Finalization steps are idempotent so a re-run after a partial failure
      # (e.g. npm publish succeeded but a later step died) walks through completed
      # steps as no-ops and finishes the missing ones.
      - name: Commit, Tag, and Push Release Branch Atomically
        run: |
          VERSION_TAG="${{ steps.bump-version.outputs.new_version }}"
          BRANCH="release/$VERSION_TAG"
          if git ls-remote --tags --exit-code origin "refs/tags/$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already on remote — skipping push (re-run recovery)"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore: release $VERSION_TAG"
          git tag -a "$VERSION_TAG" -m "Release $VERSION_TAG"
          git push --atomic origin "$BRANCH" "$VERSION_TAG"

      - name: Create GitHub Release and Release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_TAG="${{ steps.bump-version.outputs.new_version }}"
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Release $VERSION_TAG already exists — skipping (re-run recovery)"
          else
            gh release create "$VERSION_TAG" --generate-notes --latest
          fi
          if [ -n "$(gh pr list --head "release/$VERSION_TAG" --state open --json number --jq '.[].number')" ]; then
            echo "Release PR for $VERSION_TAG already open — skipping (re-run recovery)"
            exit 0
          fi
          gh pr create \
            --head "release/$VERSION_TAG" \
            --title "chore: release $VERSION_TAG" \
            --body "Automated release PR: version bump for $VERSION_TAG, already published to npm with provenance. Merge to sync main with the released version — the next publish dispatch is blocked until this lands."
