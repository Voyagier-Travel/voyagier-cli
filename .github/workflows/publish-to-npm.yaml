name: Publish to NPM

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Workflow Branch
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::${{ github.ref_name }} is not an allowed branch for Publish to NPM"
            exit 1
          fi

      - name: Checkout the Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Determine Version Bump
        id: determine-bump
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tags found, defaulting to minor bump"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMIT_COUNT=$(git rev-list "$LATEST_TAG"..HEAD --count)
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "::error::No new commits since $LATEST_TAG, nothing to publish"
            exit 1
          fi

          COMMITS=$(git log "$LATEST_TAG"..HEAD --format="%s")

          BUMP=""

          while IFS= read -r subject; do
            if [ -z "$subject" ]; then continue; fi

            if echo "$subject" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
              BUMP="major"
              break
            fi

            if echo "$subject" | grep -qE '^feat(\(.+\))?:'; then
              if [ "$BUMP" != "major" ]; then
                BUMP="minor"
              fi
            fi

            if echo "$subject" | grep -qE '^fix(\(.+\))?:'; then
              if [ -z "$BUMP" ]; then
                BUMP="patch"
              fi
            fi
          done <<< "$COMMITS"

          if [ -z "$BUMP" ]; then
            BUMP="minor"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Version bump: $BUMP"

      - name: Configure Git Identity
        run: |
          git config --global user.email "apis@voyagier.com"
          git config --global user.name "Voyagier Bot"

      - name: Bump Version
        id: bump-version
        run: |
          NEW_VERSION=$(npm --no-git-tag-version version ${{ steps.determine-bump.outputs.bump }})
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Build
        run: npm run build --if-present

      - name: Publish to NPM
        run: npm publish --access public --provenance

      - name: Commit and Push Version Update
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release ${{ steps.bump-version.outputs.new_version }}"
          git push origin main

      - name: Create Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_TAG="${{ steps.bump-version.outputs.new_version }}"
          git tag -a "$VERSION_TAG" -m "Release $VERSION_TAG"
          git push origin "$VERSION_TAG"
          gh release create "$VERSION_TAG" --generate-notes --latest
