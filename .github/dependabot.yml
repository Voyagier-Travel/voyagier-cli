version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # ts-jest declares peer typescript ">=4.3 <7" — unignore once ts-jest supports TS 7
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
